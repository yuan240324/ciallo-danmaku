name: Deploy static site to GitHub Pages

# 触发条件：
#   - 推送到 main 分支时自动部署
#   - 也可以在 Actions 页面手动触发（workflow_dispatch）
on:
  push:
    branches: [main]
  workflow_dispatch:

# 授予 GITHUB_TOKEN 部署 Pages 所需的最小权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个部署任务；排队中的任务不取消正在进行的部署
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare publish directory
        run: |
          set -e
          mkdir -p _site
          # 站点是零构建的纯静态页面，直接把需要的文件拷过去即可。
          # 显式列举而不是 `cp -r .`，避免把 .git / .github / node_modules 之类打进去。
          cp index.html _site/
          cp -r css js audio _site/
          cp LICENSE AI-TRAINING-NOTICE.md README.md _site/ 2>/dev/null || true
          # 告诉 GitHub Pages 不要用 Jekyll 处理（避免忽略下划线开头的文件）
          touch _site/.nojekyll
          echo "---- 待发布文件 ----"
          find _site -type f | sort

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
